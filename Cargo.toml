[package]
name = "mooze-wallet-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
bdk_wallet = { version = "2.1.0", features = ["bip39", "keys-bip39"] }
lwk_common = "0.10.0"
lwk_signer = "0.10.0"
lwk_wollet = "0.10.0"
breez-sdk-liquid = { git = "https://github.com/breez/breez-sdk-liquid", tag = "0.11.2" }
anyhow = "1.0.99"
tokio = "1.47.1"
thiserror = "2.0.16"
flutter_rust_bridge = "2.9.0"
parking_lot = "0.12.4"
bdk_electrum = "0.23.1"
async-trait = "0.1.89"
chrono = "0.4.42"
serde = "1.0.219"
tokio-tungstenite = "0.27.0"
serde_json = "1.0.143"
uuid = { version = "1.18.1", features = ["v4"] }
futures-util = "0.3.31"

[patch.crates-io]
secp256k1-zkp = { git = "https://github.com/breez/rust-secp256k1-zkp.git", rev = "eac2e479255a6e32b5588bc25ee53c642fdd8395" }
